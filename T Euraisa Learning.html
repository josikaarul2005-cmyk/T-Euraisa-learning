.dy{position:relative;aspect-ratio:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;cursor:pointer;display:grid;place-items:center;padding:0}
span.dy{border:0;background:none;cursor:default}
.dy:not(span):hover{border-color:var(--acc);transform:scale(1.07)}
.dy.today{border:2px solid var(--acc);font-weight:700}
.dy.today::before{content:"";position:absolute;inset:-3px;border-radius:14px;border:2px solid var(--acc);opacity:0}
.dy.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dy u{position:absolute;bottom:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc);text-decoration:none}
.dy.sel u{background:var(--acc-ink)}
@media(max-width:800px){.calw{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){
@keyframes growY{from{transform:scaleY(0)}}
@keyframes pulseRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.28)}}
@keyframes dotp{50%{transform:scale(1.6)}}
@keyframes arcgrow{from{stroke-dashoffset:var(--L)}}
.arc{animation:arcgrow 1.3s ease-out both}
.col i{animation:growY .8s calc(.08s*var(--n)) ease-out both}
.dy{transition:transform .18s ease,border-color .2s ease,background-color .2s ease}
.dy.today::before{animation:pulseRing 2s ease-out infinite}
.dy u{animation:dotp 1.8s ease-in-out infinite}
.cg2.anim .dy{animation:pop .45s calc(var(--i)*.02s) ease-out both}
.cg2.anim.dn{animation:slideR .5s ease-out}.cg2.anim.dp{animation:slideL .5s ease-out}
.evi{animation:rise .45s calc(var(--i)*.08s) ease-out both}
}

<div class="kpis"><div class="card"><b>${started}</b><span class="mut">Courses started</span></div><div class="card"><b>${tot}</b><span class="mut">Modules in total</span></div><div class="card"><b>12.0</b><span class="mut">Hours this week</span></div><div class="card"><b>82%</b><span class="mut">Average quiz score</span></div></div>
<div class="card"><h2 style="margin-top:0">Study hours this week</h2><div class="cht">${wk.map((d,k)=>`<div class="col" style="--n:${k}" title="${d[1]} hours"><i style="height:${d[1]/3*100}%"></i><span>${d[0]}</span></div>`).join("")}</div></div>
<div class="card"><h2 style="margin-top:0">Most progress</h2>${top.map(c=>`<div class="pc"><span>${esc(c.n)}</span><div class="bar"><span><i style="width:${c.p}%"></i></span><em>${c.p}%</em></div></div>`).join("")}</div></div>`}
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const EV={"2026-11-17":["Live class: Business Communication, 6:00 PM"],"2026-11-19":["Live class: Professional Skills (Career Skills), 5:00 PM"],"2026-11-20":["Assignment due: Client proposal email"],"2026-11-23":["Test: Professional Skills (Team Skills)"],"2026-11-28":["Health and Safety workshop"],"2026-12-3":["Live class: Business Communication, 6:00 PM"],"2026-12-10":["Final test: Business Communication"]};
let cm={y:2026,m:10,sel:null,dir:0,anim:true};
function CALBODY(){
 const y=cm.y,m=cm.m,days=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7,t=new Date(),key=d=>y+"-"+(m+1)+"-"+d,sel=cm.sel&&cm.sel.y===y&&cm.sel.m===m?cm.sel.d:null;
 let cells="";for(let i=0;i<off;i++)cells+='<span class="dy"></span>';
 for(let d=1;d<=days;d++){const e=EV[key(d)],isT=y===t.getFullYear()&&m===t.getMonth()&&d===t.getDate();
  cells+=`<button class="dy${isT?" today":""}${sel===d?" sel":""}" style="--i:${off+d-1}" onclick="pick(${d})" aria-label="${d} ${MN[m]}${e?", has events":""}${isT?", today":""}">${d}${e?"<u></u>":""}</button>`}
 const rows=sel?(EV[key(sel)]||[]).map(x=>[sel+" "+MN[m],x]):Object.keys(EV).filter(k=>k.startsWith(y+"-"+(m+1)+"-")).sort((a,b)=>a.split("-")[2]-b.split("-")[2]).flatMap(k=>EV[k].map(x=>[k.split("-")[2]+" "+MN[m],x]));
 const items=rows.length?rows.map((r,k)=>`<div class="it evi" style="--i:${k}"><b>${r[0]}</b><span class="mut">${r[1]}</span></div>`).join(""):'<p class="mut">No events on this day.</p>';
 const bs="min-height:44px;padding:6px 16px";
 return `<div class="cn"><h2>${MN[m]} ${y}</h2><button class="btn alt" style="${bs}" onclick="mv(-1)">Previous</button><button class="btn alt" style="${bs}" onclick="tod()">Today</button><button class="btn alt" style="${bs}" onclick="mv(1)">Next</button></div><div class="calw"><div><div class="wk">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<span>${d}</span>`).join("")}</div><div class="cg2${cm.anim?" anim":""}${cm.dir>0?" dn":cm.dir<0?" dp":""}">${cells}</div></div><div><h2 style="margin-top:0">${sel?sel+" "+MN[m]:"This month"}</h2><div class="list" id="evl">${items}</div></div></div>`}
function CAL(){cm.anim=true;cm.dir=0;return `<h1>Calendar</h1><div id="cal">${CALBODY()}</div>`}
function calDraw(){$("#cal").innerHTML=CALBODY()}
function pick(d){cm.sel={y:cm.y,m:cm.m,d};cm.anim=false;cm.dir=0;calDraw()}
function mv(n){cm.m+=n;if(cm.m<0){cm.m=11;cm.y--}if(cm.m>11){cm.m=0;cm.y++}cm.sel=null;cm.anim=true;cm.dir=n;calDraw()}
function tod(){const t=new Date();cm={y:t.getFullYear(),m:t.getMonth(),sel:{y:t.getFullYear(),m:t.getMonth(),d:t.getDate()},dir:0,anim:true};calDraw()}
function cnt(b){const t=b.textContent.trim();if(t.includes("/"))return;const m=t.match(/^(\D*)([\d,]*\.?\d+)(\D*)$/);if(!m)return;const dec=(m[2].split(".")[1]||"").length,end=parseFloat(m[2].replace(/,/g,"")),s=performance.now();(function f(n){const p=Math.min(1,(n-s)/1000),v=end*(1-Math.pow(1-p,3));b.textContent=m[1]+v.toLocaleString("en-IN",{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(p<1)requestAnimationFrame(f)})(s)}
function fx(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches||!("IntersectionObserver" in window))return;
 const hh=document.querySelector("#app .hh");if(hh&&!hh.querySelector(".w"))hh.innerHTML=hh.textContent.split(" ").map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(" ");
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;io.unobserve(el);
  if(el.classList.contains("rv")){el.classList.add("in");setTimeout(()=>el.classList.remove("rv","in"),800)}
  if(el.matches(".stats,.tiles,.kpis"))el.querySelectorAll("b").forEach(cnt)}),{threshold:.15});
 document.querySelectorAll("#app>h2,#app>.step,#app>.card,#app>.panel,#app .tiles>*,#app .list>*,#app>.stats").forEach(el=>{if(el.getBoundingClientRect().top>innerHeight)el.classList.add("rv");io.observe(el)});
 document.querySelectorAll("#app .stats,#app .tiles,#app .kpis").forEach(el=>io.observe(el));
}
function go(){const a=$("#app");a.classList.add("enter");render();fx();clearTimeout(go.t);go.t=setTimeout(()=>a.classList.remove("enter"),1200)}
addEventListener("hashchange",go);go();
addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".tile,.tiles>.card,.hero");if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty("--mx",(e.clientX-r.left)+"px");t.style.setProperty("--my",(e.clientY-r.top)+"px")},{passive:true});
addEventListener("scroll",()=>{const h=document.documentElement;$("#sp").style.transform="scaleX("+(h.scrollTop/((h.scrollHeight-h.clientHeight)||1))+")"},{passive:true});
</script>
</body>
</html>
